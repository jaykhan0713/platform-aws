AWSTemplateFormatVersion: '2010-09-09'
Description: 'jay-platform edge ALB stack (internal) with blue/green target groups for ECS blue green deployments'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
Resources:
  EdgeAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Edge ALB security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
        - IpProtocol: tcp
          FromPort: 9000
          ToPort: 9000
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: edge-alb-sg-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  EdgeInternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: edge-internal-alb-prod
      Scheme: internal
      Type: application
      Subnets:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroups:
        - !Ref EdgeAlbSecurityGroup
      Tags:
        - Key: Name
          Value: edge-internal-alb-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  EdgeTargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: edge-tg-blue-prod
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: edge-tg-blue-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  EdgeTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: edge-tg-green-prod
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: edge-tg-green-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  EdgeProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EdgeInternalAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref EdgeTargetGroupBlue
  EdgeTestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EdgeInternalAlb
      Port: 9000
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref EdgeTargetGroupGreen
Outputs:
  EdgeAlbArn:
    Description: Edge ALB ARN
    Value: !Ref EdgeInternalAlb
  EdgeAlbDnsName:
    Description: Edge ALB DNS name
    Value: !GetAtt EdgeInternalAlb.DNSName
  EdgeAlbSecurityGroupId:
    Description: Edge ALB security group id
    Value: !Ref EdgeAlbSecurityGroup
  EdgeProdListenerArn:
    Description: Edge prod listener ARN (port 80)
    Value: !Ref EdgeProdListener
  EdgeTestListenerArn:
    Description: Edge test listener ARN (port 9000)
    Value: !Ref EdgeTestListener
  EdgeTargetGroupBlueArn:
    Description: Edge blue target group ARN
    Value: !Ref EdgeTargetGroupBlue
  EdgeTargetGroupGreenArn:
    Description: Edge green target group ARN
    Value: !Ref EdgeTargetGroupGreen