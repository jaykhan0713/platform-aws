AWSTemplateFormatVersion: '2010-09-09'
Description: 'jay-platform edge-service: internal ALB + blue/green target groups
  + ECS Fargate service + taskdef + CodeDeploy (API GW VPC Link upstream)'

Parameters:
  ProjectTag:
    Type: String
    Default: jay-platform
  EnvTag:
    Type: String
    Default: prod

  ManagedByTag:
    Type: String
    Default: cloudformation

  VpcId:
    Type: AWS::EC2::VPC::Id

  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  ClusterName:
    Type: String
    Description: 'ECS cluster name (example: ecs-cluster-prod)'

  ServiceName:
    Type: String
    Default: edge-service-prod
    Description: ECS service name (used by CodeDeploy too)

  ContainerImage:
    Type: String
    Description: Full ECR image URI, e.g.
      <ACCOUNT_ID>...amazonaws.com/jay-platform/edge-service:git-<sha>

  ContainerPort:
    Type: Number
    Default: 8080

  DesiredCount:
    Type: Number
    Default: 1

  # AMP (Amazon Managed Service for Prometheus) workspace wiring.
  # These values should come from the per-env "observability" stack outputs.
  AmpWorkspaceId:
    Type: String
    Description: 'AMP workspace id (example: ws-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)'

  AmpRemoteWriteEndpoint:
    Type: String
    Description: AMP remote_write endpoint from observability stack output

  # Shared ADOT collector image (baked config). Built once and reused across services.
  AdotCollectorImage:
    Type: String
    Description: Full ECR image URI for shared ADOT collector config image

Resources:
  # -----------------------------
  # CloudWatch Logs
  # -----------------------------
  EdgeServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectTag}/${EnvTag}/edge-service
      RetentionInDays: 3
      Tags:
        - Key: Name
          Value: !Sub ${ProjectTag}-edge-service-logs-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  # ADOT collector logs (sidecar per task)
  EdgeAdotLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectTag}/${EnvTag}/edge-service-adot
      RetentionInDays: 3
      Tags:
        - Key: Name
          Value: !Sub ${ProjectTag}-edge-service-adot-logs-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  # -----------------------------
  # IAM roles
  # -----------------------------
  EdgeServiceTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectTag}-edge-task-execution-${EnvTag}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: AllowSsmParametersRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadParamsByPath
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jay-platform/${EnvTag}/core/*
      Tags:
        - Key: Name
          Value: !Sub ${ProjectTag}-edge-task-execution-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  EdgeServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectTag}-edge-task-role-${EnvTag}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Task role is for runtime AWS API calls made by the task containers.
      # ADOT collector uses SigV4 to remote_write metrics into AMP (aps:RemoteWrite).
      Policies:
        - PolicyName: AllowAmpRemoteWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AmpRemoteWrite
                Effect: Allow
                Action:
                  - aps:RemoteWrite
                Resource: !Sub arn:aws:aps:${AWS::Region}:${AWS::AccountId}:workspace/${AmpWorkspaceId}

        - PolicyName: AllowSsmParametersRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadParamsByPath
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jay-platform/${EnvTag}/core/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jay-platform/${EnvTag}/services/edge-service/*

        - PolicyName: AllowEcsExecSsmMessages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcsExecSsmMessages
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectTag}-edge-task-role-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectTag}-codedeploy-ecs-${EnvTag}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Name
          Value: !Sub ${ProjectTag}-codedeploy-ecs-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  # -----------------------------
  # Security Groups
  # -----------------------------
  EdgeAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Edge internal ALB SG (upstream is API Gateway VPC Link)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # TODO: Replace these VpcCidr rules with "SourceSecurityGroupId: <VpcLinkSgId>"
        # once VPC Link is created with a dedicated SG.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
        - IpProtocol: tcp
          FromPort: 9000
          ToPort: 9000
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub edge-alb-sg-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  EdgeServiceTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Edge service task SG (allow 8080 only from ALB)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref EdgeAlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub edge-tasks-sg-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  # -----------------------------
  # ALB + Blue/Green Target Groups
  # -----------------------------
  EdgeInternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub edge-internal-alb-${EnvTag}
      Scheme: internal
      Type: application
      Subnets:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroups:
        - !Ref EdgeAlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub edge-internal-alb-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  EdgeTargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub edge-tg-blue-${EnvTag}
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub edge-tg-blue-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  EdgeTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub edge-tg-green-${EnvTag}
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /actuator/health
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub edge-tg-green-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  EdgeProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EdgeInternalAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref EdgeTargetGroupBlue

  EdgeTestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref EdgeInternalAlb
      Port: 9000
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref EdgeTargetGroupGreen

  # -----------------------------
  # ECS Service (CodeDeploy Blue/Green)
  # -----------------------------
  EdgeEcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - EdgeProdListener
      - EdgeTestListener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterName
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: true
      DeploymentController:
        Type: CODE_DEPLOY
      #TaskDefinition: !Ref EdgeServiceTaskDefinition **REMOVED**
      # IMPORTANT: CODE_DEPLOY controls TaskDefinition updates and deployments.
      # CloudFormation must not attempt to update TaskDefinition on a CODE_DEPLOY service.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetAId
            - !Ref PrivateSubnetBId
          SecurityGroups:
            - !Ref EdgeServiceTaskSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref EdgeTargetGroupBlue
      HealthCheckGracePeriodSeconds: 60
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !ImportValue jay-platform-network-prod-service-connect-http-namespace-arn
      Tags:
        - Key: Name
          Value: !Sub ${ServiceName}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

  # -----------------------------
  # ECS Service Auto-Scaling
  # -----------------------------
  EdgeServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn:
      - EdgeEcsService
      - EdgeProdListener
      - EdgeTestListener
    Properties:
      MaxCapacity: 6
      MinCapacity: 1
      ResourceId: !Sub service/${ClusterName}/${ServiceName}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  EdgeServiceCpuTargetTrackingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ServiceName}-cpu-tt
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref EdgeServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 180
        ScaleOutCooldown: 60

  # -----------------------------
  # CodeDeploy (ECS Blue/Green)
  # -----------------------------
  EdgeCodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectTag}-edge-service-${EnvTag}
      ComputePlatform: ECS

  EdgeCodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    DependsOn:
      - EdgeEcsService
      - EdgeProdListener
      - EdgeTestListener
    Properties:
      ApplicationName: !Ref EdgeCodeDeployApp
      DeploymentGroupName: !Sub ${ProjectTag}-edge-dg-${EnvTag}
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: !Ref ClusterName
          ServiceName: !Ref ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !GetAtt EdgeTargetGroupBlue.TargetGroupName
              - Name: !GetAtt EdgeTargetGroupGreen.TargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref EdgeProdListener
            TestTrafficRoute:
              ListenerArns:
                - !Ref EdgeTestListener

Outputs:
  EdgeAlbArn:
    Value: !Ref EdgeInternalAlb
  EdgeAlbDnsName:
    Value: !GetAtt EdgeInternalAlb.DNSName

  EdgeProdListenerArn:
    Value: !Ref EdgeProdListener
  EdgeTestListenerArn:
    Value: !Ref EdgeTestListener

  EdgeTargetGroupBlueArn:
    Value: !Ref EdgeTargetGroupBlue
  EdgeTargetGroupGreenArn:
    Value: !Ref EdgeTargetGroupGreen

  EdgeAlbSecurityGroupId:
    Value: !Ref EdgeAlbSecurityGroup
  EdgeTaskSecurityGroupId:
    Value: !Ref EdgeServiceTaskSecurityGroup

  EdgeServiceName:
    Value: !Ref ServiceName

  CodeDeployAppName:
    Value: !Ref EdgeCodeDeployApp
  CodeDeployDeploymentGroupName:
    Value: !Ref EdgeCodeDeployDeploymentGroup