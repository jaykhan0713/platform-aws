AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  ServiceDiscoveryNamespaceName:
    Type: String
    Default: services.internal

Resources:
  # -----------------------------
  # VPC
  # -----------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: jay-platform-vpc-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: igw-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  VpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: us-west-2a
      CidrBlock: 10.0.0.0/20
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: public-subnet-a-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: Tier
          Value: public
        - Key: ManagedBy
          Value: cloudformation
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: us-west-2b
      CidrBlock: 10.0.16.0/20
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: public-subnet-b-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: Tier
          Value: public
        - Key: ManagedBy
          Value: cloudformation
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: us-west-2a
      CidrBlock: 10.0.32.0/20
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: private-subnet-a-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: Tier
          Value: private
        - Key: ManagedBy
          Value: cloudformation
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: us-west-2b
      CidrBlock: 10.0.48.0/20
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: private-subnet-b-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: Tier
          Value: private
        - Key: ManagedBy
          Value: cloudformation
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: public-rt-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcIgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: private-rt-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # -----------------------------
  # Service Discovery
  # -----------------------------

  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref ServiceDiscoveryNamespaceName
      Vpc: !Ref VPC
      Description: !Sub ${AWS::StackName} service discovery namespace
      Tags:
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation
        - Key: Name
          Value: !Sub service-discovery-${ServiceDiscoveryNamespaceName}-prod
Outputs:
  # -----------------------------
  # VPC Outputs
  # -----------------------------
  VpcId:
    Value: !Ref VPC
    Export:
      Name: jay-platform-network-prod-vpc-id
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export:
      Name: jay-platform-network-prod-private-subnet-a-id
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export:
      Name: jay-platform-network-prod-private-subnet-b-id
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
  VpcCidr:
    Value: 10.0.0.0/16
    Export:
      Name: jay-platform-network-prod-vpc-cidr

  # -----------------------------
  # Service Discovery Outputs
  # -----------------------------
  ServiceDiscoveryNamespaceId:
    Value: !Ref ServiceDiscoveryNamespace
    Export:
      Name: jay-platform-network-prod-service-discovery-namespace-id

  ServiceDiscoveryNamespaceName:
    Value: !Ref ServiceDiscoveryNamespaceName
    Export:
      Name: jay-platform-network-prod-service-discovery-namespace-name