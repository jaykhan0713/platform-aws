AWSTemplateFormatVersion: "2010-09-09"
Description: 'VPC Endpoints for private-subnet ECS with no NAT'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id

  PrivateRouteTableId:
    Type: String
    Description: Route table id for private subnets (rtb-xxxx)

  VpcCidr:
    Type: String
    Description: "VPC CIDR (example: 10.0.0.0/16). Used to allow HTTPS to endpoints from inside VPC."
    Default: 10.0.0.0/16

Resources:
  # One SG shared by interface endpoints.
  # Starter rule: allow 443 from the entire VPC CIDR.
  # FUTURE: tighten this to "from ECS tasks/service SecurityGroup only" instead of the whole VPC.
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS to VPC interface endpoints from inside VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: vpc-endpoints-sg-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  # -------- Interface Endpoints (PrivateLink) --------

  EcrApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ecr-api-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  EcrDkrVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ecr-dkr-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  CloudWatchLogsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: logs-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  AmpVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.aps-workspaces"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: amp-aps-workspaces-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  XRayVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.xray"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: xray-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  # -------- Interface Endpoints (SSM / ECS Exec) --------

  # NOTE: AWS docs all three as necessary for ECS Exec (future). For parameter store only ssm-vpce is needed.

  # SSM (Systems Manager) core API endpoint.
  # Used for SSM control-plane APIs (Parameter Store, SSM APIs, and supporting ECS Exec flows).
  # If you ever fetch config from Parameter Store at runtime, this is the endpoint you are using.
  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ssm-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  # ssmmessages (SSM Messages) data/control channel for interactive sessions.
  # This is the "tunnel" endpoint used by ECS Exec session traffic (interactive shell / command stream).
  # Without this, execute-command typically fails or hangs because the session channels cannot be opened.
  SsmMessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ssm-messages-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

  # ec2messages (EC2 Messages) supporting messaging channel used by SSM agent style communications.
  # ECS Exec relies on this endpoint as part of the SSM messaging backend in many setups.
  # Think of it as a companion to ssmmessages that SSM uses for session/message plumbing.
  Ec2MessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetAId
        - !Ref PrivateSubnetBId
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ec2-messages-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

# TODO: kms vpce for SSM SecureStrings when needed

  # -------- Gateway Endpoint (S3) --------
  # Key piece for ECR image layers (stored in S3 behind the scenes).
  S3GatewayVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTableId
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ViaEndpoint
            Effect: Allow
            Principal: "*"
            Action: "s3:*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: s3-gateway-vpce-prod
        - Key: Project
          Value: jay-platform
        - Key: Env
          Value: prod
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  VpcEndpointSecurityGroupId:
    Value: !Ref VpcEndpointSecurityGroup

  EcrApiVpcEndpointId:
    Value: !Ref EcrApiVpcEndpoint

  EcrDkrVpcEndpointId:
    Value: !Ref EcrDkrVpcEndpoint

  CloudWatchLogsVpcEndpointId:
    Value: !Ref CloudWatchLogsVpcEndpoint

  S3GatewayVpcEndpointId:
    Value: !Ref S3GatewayVpcEndpoint

  AmpVpcEndpointId:
    Value: !Ref AmpVpcEndpoint

  XRayVpcEndpointId:
    Value: !Ref XRayVpcEndpoint

  SsmVpcEndpointId:
    Value: !Ref SsmVpcEndpoint

  SsmMessagesVpcEndpointId:
    Value: !Ref SsmMessagesVpcEndpoint

  Ec2MessagesVpcEndpointId:
    Value: !Ref Ec2MessagesVpcEndpoint