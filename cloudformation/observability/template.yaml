AWSTemplateFormatVersion: '2010-09-09'
Description: 'jay-platform observability: AMP (prometheus) workspace + shared
  outputs for ADOT per-task sidecars'

Parameters:
  ProjectTag:
    Type: String
    Default: jay-platform
  EnvTag:
    Type: String
    Default: prod
  ManagedByTag:
    Type: String
    Default: cloudformation

Resources:
  AmpWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Sub ${ProjectTag}-${EnvTag}-amp
      Tags:
        - Key: Name
          Value: !Sub ${ProjectTag}-amp-${EnvTag}
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Env
          Value: !Ref EnvTag
        - Key: ManagedBy
          Value: !Ref ManagedByTag

Outputs:
  AmpWorkspaceId:
    Description: Workspace ID (ws-...) for URL paths
    Value: !GetAtt AmpWorkspace.WorkspaceId

  AmpWorkspaceArn:
    Description: AMP workspace ARN (useful for IAM policies)
    Value: !GetAtt AmpWorkspace.Arn

  AmpPrometheusEndpoint:
    Description: AMP Prometheus endpoint (ends with /api/v1/)
    Value: !Sub
      - ${URL}api/v1/
      - URL: !GetAtt AmpWorkspace.PrometheusEndpoint

  AmpRemoteWriteEndpoint:
    Description: ADOT remote_write endpoint for metrics ingestion
    Value: !Sub
      - ${URL}api/v1/remote_write
      - URL: !GetAtt AmpWorkspace.PrometheusEndpoint

  AmpQueryEndpoint:
    Description: Grafana Prometheus datasource base URL (SigV4)
    Value: !Sub
      - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${WsId}
      - WsId: !GetAtt AmpWorkspace.WorkspaceId