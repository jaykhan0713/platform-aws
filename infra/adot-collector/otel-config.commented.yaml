# commented version as param store only stores < 4kb of data
receivers:
  # prometheus scraper that scrapes app's /actuator/prometheus endpoint periodically
  prometheus:
    config:
      scrape_configs:
        - job_name: ${SERVICE_NAME}
          metrics_path: /actuator/prometheus
          scrape_interval: 15s
          static_configs:
            - targets: ['127.0.0.1:${APP_PORT}']
          relabel_configs:
            - target_label: service
              replacement: ${SERVICE_NAME}
            - target_label: env
              replacement: ${ENV}
            - target_label: container
              replacement: ${APP_CONTAINER_NAME}
            - target_label: git_sha_build
              replacement: ${GIT_SHA_BUILD}

  # receive traces from app to otlp collector
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Calls ECS task metadata endpoint, available inside task
  # Adds resource attributes like cluster, task ARN, container name, etc
  resourcedetection/ecs:
    detectors: [ecs]
    timeout: 2s
    override: false

  # Create ONLY the ECS labels we care about as RESOURCE attributes.
  # NOTE: your ADOT Collector build (v0.46.0) does NOT include the transform processor,
  # so we cannot regex-extract the short task id here. We'll keep full ARN and optionally
  # shorten in Grafana later via label_replace().
  resource/ecs_labels:
    attributes:
      # task id after taskARN.../<ID>
      - key: ecs_task
        action: upsert
        from_attribute: aws.ecs.task.id

      # drop sensitive/noisy cloud + raw ecs metadata so AMP label set stays clean
      - key: cloud.account.id
        action: delete
      - key: cloud.region
        action: delete
      - key: cloud.provider
        action: delete
      - key: cloud.platform
        action: delete
      - key: cloud.availability_zone
        action: delete

      - key: aws.ecs.cluster.arn
        action: delete
      - key: aws.ecs.task.arn
        action: delete
      - key: aws.ecs.task.family
        action: delete
      - key: aws.ecs.task.id
        action: delete
      - key: aws.ecs.task.revision
        action: delete
      - key: aws.ecs.launchtype
        action: delete

      - key: aws.log.group.arns
        action: delete
      - key: aws.log.group.names
        action: delete
      - key: aws.log.stream.arns
        action: delete
      - key: aws.log.stream.names
        action: delete

  attributes/http_normalize: # map spring otlp starter keys to xray keys
    actions:
      # Build standard HTTP semconv keys from what you actually receive
      - key: http.request.method
        action: upsert
        from_attribute: method

      - key: url.path
        action: upsert
        from_attribute: uri

      # Best case is route template. Does not exist yet, so path is the fallback.
      - key: http.route
        action: upsert
        from_attribute: uri

      - key: http.response.status_code
        action: upsert
        from_attribute: status

      # status is currently "200" as a string. Convert after copy.
      - key: http.response.status_code
        action: convert
        converted_type: int

      # Optional: keep the simpler alias keys too
      - key: http.method
        action: upsert
        from_attribute: method

      - key: http.status_code
        action: upsert
        from_attribute: http.response.status_code

  filter/drop_actuator_spans: # stops startup spans before service is ready (but port is binded)
    traces:
      span:
        - 'attributes["uri"] == "/actuator/prometheus"'
        - 'attributes["uri"] == "/actuator/health"'
        - 'attributes["uri"] == "/actuator/health/liveness"'
        - 'attributes["uri"] == "/actuator/health/readiness"'

extensions:
  sigv4auth:
    region: ${AWS_REGION}

exporters:
  prometheusremotewrite:
    endpoint: ${AMP_REMOTE_WRITE_ENDPOINT}
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion: # ecs metadata become labels on time series
      enabled: true

  # export traces to AWS X-Ray
  awsxray:
    region: ${AWS_REGION}

service:
  telemetry:
    logs:
      level: "info"
  # adot/OTLP exporter signs every HTTP or gRPC request the same way the AWS CLI signs API calls.
  # This lets AWS services accept telemetry without API keys.
  # prometheusremotewrite needs this. awsxray uses sigv4auth by default
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resourcedetection/ecs, resource/ecs_labels]
      exporters: [prometheusremotewrite]

    # traces pipeline (OTLP in, X-Ray out)
    traces:
      receivers: [otlp]
      processors: [attributes/http_normalize, filter/drop_actuator_spans]
      exporters: [awsxray]
