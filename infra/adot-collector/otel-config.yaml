receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ${SERVICE_NAME}
          metrics_path: /actuator/prometheus
          scrape_interval: 15s
          static_configs:
            - targets: ['127.0.0.1:${APP_PORT}']
          relabel_configs:
            - target_label: service
              replacement: ${SERVICE_NAME}
            - target_label: env
              replacement: ${ENV}

  # receive traces from your app via OTLP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  sigv4auth:
    region: ${AWS_REGION}

exporters:
  prometheusremotewrite:
    endpoint: ${AMP_REMOTE_WRITE_ENDPOINT}
    auth:
      authenticator: sigv4auth

  # export traces to AWS X-Ray
  awsxray:
    region: ${AWS_REGION}

service:
  telemetry:
    logs:
      level: "info"
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]

    # NEW: traces pipeline (OTLP in, X-Ray out)
    traces:
      receivers: [otlp]
      exporters: [awsxray]
