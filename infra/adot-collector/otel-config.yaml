receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ${SERVICE_NAME}
          metrics_path: /actuator/prometheus
          scrape_interval: 15s
          static_configs:
            - targets: ['127.0.0.1:${APP_PORT}']
          relabel_configs:
            - target_label: service
              replacement: ${SERVICE_NAME}
            - target_label: env
              replacement: ${ENV}

  # receive traces from your app via OTLP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Calls ECS task metadata endpoint, available inside task
  # Adds resource attributes like cluster, task ARN, container name, etc
  resourcedetection/ecs:
    detectors: [ecs]
    timeout: 2s
    override: false

  transform/ecs_labels:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          # deploy (gitsha-buildnum) and container copied straight over
          - set(attributes["deploy"], attributes["aws.ecs.container.image.tag"])
          - set(attributes["container"], attributes["aws.ecs.container.name"])

          # ecs_task = last path segment of task ARN
          - set(attributes["ecs_task"], replace_pattern(attributes["aws.ecs.task.arn"], ".*/", ""))

          # cleanup (delete raw + sensitive)
          - delete_key(attributes, "aws.ecs.task.arn")
          - delete_key(attributes, "aws.ecs.cluster.arn")
          - delete_key(attributes, "aws.ecs.cluster.name")
          - delete_key(attributes, "aws.ecs.container.name")
          - delete_key(attributes, "aws.ecs.container.image.name")
          - delete_key(attributes, "aws.ecs.container.image.tag")

          - delete_key(attributes, "cloud.account.id")
          - delete_key(attributes, "cloud.region")
          - delete_key(attributes, "cloud.provider")

  attributes/http_normalize: # map spring otlp starter keys to xray keys
    actions:
      # Build standard HTTP semconv keys from what you actually receive
      - key: http.request.method
        action: upsert
        from_attribute: method

      - key: url.path
        action: upsert
        from_attribute: uri

      # Best case is route template. Does not exist yet, so path is the fallback.
      - key: http.route
        action: upsert
        from_attribute: uri

      - key: http.response.status_code
        action: upsert
        from_attribute: status

      # status is currently "200" as a string. Convert after copy.
      - key: http.response.status_code
        action: convert
        converted_type: int

      # Optional: keep the simpler alias keys too
      - key: http.method
        action: upsert
        from_attribute: method

      - key: http.status_code
        action: upsert
        from_attribute: http.response.status_code

  filter/drop_actuator_spans: # stops startup spans before service is ready (but port is binded)
    traces:
      span:
        - 'attributes["uri"] == "/actuator/prometheus"'
        - 'attributes["uri"] == "/actuator/health"'
        - 'attributes["uri"] == "/actuator/health/liveness"'
        - 'attributes["uri"] == "/actuator/health/readiness"'

extensions:
  sigv4auth:
    region: ${AWS_REGION}

exporters:
  prometheusremotewrite:
    endpoint: ${AMP_REMOTE_WRITE_ENDPOINT}
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion: #ecs metadata become labels on time series.
      enabled: true

  # export traces to AWS X-Ray
  awsxray:
    region: ${AWS_REGION}

service:
  telemetry:
    logs:
      level: "info"
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resourcedetection/ecs,transform/ecs_labels]
      exporters: [prometheusremotewrite]

    #traces pipeline (OTLP in, X-Ray out)
    traces:
      receivers: [otlp]
      processors: [attributes/http_normalize, filter/drop_actuator_spans]
      exporters: [awsxray]
